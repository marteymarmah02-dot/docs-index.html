<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Congregation Literature</title>
<style>
:root{
  --bg:#121212; --surface:#1A1A1A; --card:#232323; --card2:#2A2A2A;
  --accent:#D2691E; --accent-dim:#7A3D17; --banner-bg:#3A2413;
  --active-bg:#3D2015;
  --text:#FFFFFF; --muted:#9A9A9A; --muted2:#787878;
  --border:#2E2E2E; --ok:#3FA872; --ok-bg:#173324;
  --danger:#D9534F; --danger-bg:#3A1E1C;
  --tap:48px; --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:30; background:var(--bg);
  display:flex; align-items:center; gap:.6rem; padding:.7rem .8rem; min-height:60px;
}
.icon-sq{
  width:44px; height:44px; display:flex; align-items:center; justify-content:center;
  background:var(--accent); border-radius:12px; flex-shrink:0; border:none; color:#fff;
}
.icon-sq svg{ display:block; }
.topbar-page{ font-size:1.15rem; font-weight:700; margin-left:.1rem; }

/* ---------- drawer ---------- */
.scrim{ position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s; }
.scrim.open{ opacity:1; pointer-events:auto; }
.drawer{
  position:fixed; top:0; left:0; bottom:0; width:85%; max-width:340px; background:#161616;
  z-index:50; transform:translateX(-100%); transition:transform .22s ease; overflow-y:auto;
}
.drawer.open{ transform:translateX(0); }
.drawer-header{ display:flex; align-items:flex-start; gap:.7rem; padding:1.1rem 1rem .3rem; }
.drawer-brand-icon{ width:44px; height:44px; border-radius:12px; background:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff; }
.drawer-brand-text{ flex:1; line-height:1.2; padding-top:.1rem; }
.drawer-brand-text .l1{ font-weight:700; font-size:1.05rem; color:#fff; }
.drawer-brand-text .l2{ font-weight:700; font-size:1.05rem; color:var(--accent); }
.drawer-close{ width:36px; height:36px; border-radius:999px; background:#2A2A2A; display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; flex-shrink:0; border:none; }
.drawer-cong{ padding:.4rem 1rem 1rem; font-size:.78rem; color:var(--muted); letter-spacing:.02em; }
.drawer-section{ padding:1rem 1rem .4rem; font-size:11px; font-weight:800; letter-spacing:.09em; color:var(--muted2); text-transform:uppercase; }
.drawer nav{ padding-bottom:2rem; }
.drawer-item{
  display:block; width:calc(100% - 1.2rem); margin:.15rem .6rem; text-align:left; padding:.85rem .9rem; min-height:var(--tap);
  color:#E6E6E6; font-size:1rem; border-radius:var(--radius); background:none; border:none;
}
.drawer-item.active{ background:var(--active-bg); color:var(--accent); font-weight:700; }
.drawer-item:not(.active):hover{ background:#1F1F1F; }

/* ---------- layout ---------- */
.wrap{ max-width:640px; margin:0 auto; padding:.9rem .9rem 3rem; }
.eyebrow{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); font-weight:700; }
h1.page-title{ font-size:2rem; font-weight:800; margin:.2rem 0 0; }
.subtext{ color:var(--muted); font-size:.9rem; margin-top:.35rem; }
.banner{
  margin-top:1.1rem; background:var(--banner-bg); border-radius:999px; padding:1rem 1.3rem; font-size:.95rem; color:#fff;
}
.banner b{ font-weight:700; }

section{ margin-top:1.7rem; }
h2.section-title{ font-size:1.05rem; font-weight:700; margin:0 0 .6rem; }
.eyebrow-label{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted2); font-weight:800; margin-bottom:.7rem; }

.field-label{ display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:.4rem; text-transform:uppercase; letter-spacing:.03em;}
.field-select, .field-input{
  width:100%; min-height:var(--tap); border-radius:var(--radius); background:var(--card2); border:1px solid var(--border);
  color:#fff; padding:0 .9rem; font-size:1rem;
}
.field-select:focus, .field-input:focus{ border-color:var(--accent); }
.search-row{ display:flex; gap:.5rem; }
.search-row .field-input{ flex:1; }
.search-btn{ width:var(--tap); height:var(--tap); border-radius:var(--radius); background:var(--card2); border:1px solid var(--border); color:var(--muted); display:flex; align-items:center; justify-content:center; flex-shrink:0;}

/* quick action cards (Home) */
.qa-card{
  display:flex; align-items:center; justify-content:space-between; gap:.6rem; width:100%; text-align:left;
  min-height:64px; padding:1rem 1.1rem; border-radius:var(--radius); background:var(--card); border:none; margin-top:.7rem;
}
.qa-card .qa-title{ font-weight:700; font-size:1rem; color:#fff; }
.qa-card .qa-sub{ font-size:.85rem; color:var(--muted); margin-top:.2rem; }
.qa-card .chev{ color:var(--muted2); font-size:1.3rem; flex-shrink:0; }

/* at a glance rows */
.glance-row{
  display:flex; align-items:center; justify-content:space-between; min-height:56px; padding:1rem 1.1rem;
  border-radius:var(--radius); background:var(--card); margin-top:.7rem;
}
.glance-label{ font-weight:700; font-size:1rem; }
.glance-value{ font-weight:800; font-size:1.4rem; color:var(--accent); }

.cat-list{ margin-top:.9rem; }
.cat-item{
  display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left;
  min-height:var(--tap); padding:.85rem 0; border-bottom:1px solid var(--border); color:#9DBEE8; font-size:1rem; background:none; border-left:none; border-right:none; border-top:none;
}
.cat-item .chev{ color:var(--muted2); }

.item-list{ margin-top:.6rem; display:flex; flex-direction:column; gap:.55rem; }
.item-card{
  display:flex; align-items:center; justify-content:space-between; gap:.6rem;
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:.75rem .9rem;
}
.item-name{ font-size:.92rem; }
.item-sub{ font-size:.75rem; color:var(--muted); margin-top:.1rem; }
.add-btn{
  min-width:44px; min-height:36px; border-radius:8px; background:var(--accent); color:#fff; font-weight:700; font-size:.85rem;
  padding:0 .8rem; border:none;
}

.btn{ min-height:var(--tap); display:inline-flex; align-items:center; justify-content:center; gap:.4rem; border-radius:var(--radius); padding:0 1.1rem; font-weight:700; font-size:.92rem; border:none; }
.btn-primary{ background:var(--accent); color:#fff; }
.btn-primary:hover{ background:#b85a19; }
.btn-ghost{ background:var(--card2); color:#fff; border:1px solid var(--border); }
.btn-ghost:hover{ background:#333; }
.btn-danger{ background:var(--danger-bg); color:#F5A9A6; }
.btn-block{ width:100%; }
.btn-sm{ min-height:38px; padding:0 .8rem; font-size:.82rem; border-radius:9px; }

.rr-card{ background:var(--card); border-radius:var(--radius); padding:1rem; margin-top:.75rem; }
.rr-lang{ color:var(--accent); font-weight:800; font-size:1.15rem; }
.rr-grid{ display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-top:.8rem; }
.rr-label{ color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.03em; font-weight:700;}
.rr-val{ font-size:1.3rem; font-weight:700; margin-top:.2rem; }
.rr-val.editable-input{ width:100%; background:var(--card2); border:1px solid var(--border); border-radius:8px; padding:.4rem .6rem; font-size:1.05rem; color:#fff; margin-top:.25rem;}
.rr-actions{ display:flex; gap:.5rem; margin-top:.9rem; }

.toast{ position:fixed; bottom:1.25rem; left:50%; transform:translateX(-50%); background:#fff; color:#111; font-size:.875rem; font-weight:600; padding:.6rem 1.1rem; border-radius:999px; box-shadow:0 10px 25px -5px rgba(0,0,0,.4); z-index:80;}
.modal-scrim{ position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:60; display:flex; align-items:flex-end; justify-content:center;}
.modal{ background:#1C1C1C; border-top-left-radius:18px; border-top-right-radius:18px; width:100%; max-width:640px; padding:1.2rem 1rem 1.6rem; max-height:85vh; overflow-y:auto;}
.modal h3{ margin:0 0 1rem; font-size:1.1rem; }
.modal .field-label{ margin-top:.9rem; }
.modal .field-label:first-of-type{ margin-top:0; }

.mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; }
table.simple{ width:100%; border-collapse:collapse; margin-top:.6rem; font-size:.88rem; }
table.simple th{ text-align:left; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.03em; padding:.4rem .5rem; border-bottom:1px solid var(--border); }
table.simple td{ padding:.6rem .5rem; border-bottom:1px solid var(--border); }
.empty{ border:1px dashed var(--border); border-radius:var(--radius); padding:1.5rem 1rem; text-align:center; color:var(--muted); font-size:.9rem; margin-top:.75rem;}
.pill{ display:inline-flex; align-items:center; border-radius:999px; padding:.25rem .65rem; font-size:11px; font-weight:700; text-transform:uppercase; }
.pill-ok{ background:var(--ok-bg); color:#7FD9A6; }
.pill-pending{ background:#3A2E17; color:#E0B15C; }
.pill-role{ background:var(--card2); color:var(--accent); border:1px solid var(--border); }
.pill-danger{ background:var(--danger-bg); color:#F5A9A6; }

/* ---------- auth gate ---------- */
#authGate{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.2rem; }
.auth-card{ width:100%; max-width:400px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1.4rem 1.2rem; }
.auth-brand{ display:flex; align-items:center; gap:.6rem; margin-bottom:1rem; }
.auth-brand .icon-sq{ position:static; }
.auth-tabs{ display:flex; gap:.4rem; margin-bottom:1rem; background:var(--card2); border-radius:12px; padding:.3rem; }
.auth-tab{ flex:1; text-align:center; padding:.6rem 0; border-radius:9px; background:none; border:none; color:var(--muted); font-weight:700; font-size:.88rem; }
.auth-tab.active{ background:var(--accent); color:#fff; }
.auth-err{ background:var(--danger-bg); color:#F5A9A6; border-radius:10px; padding:.6rem .8rem; font-size:.85rem; margin-top:.8rem; }
.auth-note{ color:var(--muted); font-size:.8rem; margin-top:.7rem; line-height:1.4; }
#appShell{ display:none; }
.duty-card{ background:var(--banner-bg); border-radius:18px; padding:1.3rem; margin-top:1rem; }
.duty-eyebrow{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:#E7B98A; font-weight:800; }
.duty-name{ font-size:1.7rem; font-weight:800; margin-top:.3rem; }
.duty-grid{ display:grid; grid-template-columns:1fr 1fr; gap:.9rem; margin-top:1rem; }
.duty-label{ font-size:11px; text-transform:uppercase; color:#D9A876; font-weight:700; letter-spacing:.03em; }
.duty-val{ font-size:1.05rem; font-weight:700; margin-top:.15rem; }

/* ---------- professional polish layer ---------- */
:root{
  --bg:#0b0d12;
  --surface:#11151d;
  --card:#171c26;
  --card2:#1d2430;
  --accent:#f28a4b;
  --accent-strong:#ff9f62;
  --accent-dim:#6f3822;
  --banner-bg:linear-gradient(135deg,#3d2319 0%,#241a19 100%);
  --active-bg:rgba(242,138,75,.14);
  --text:#f7f8fb;
  --muted:#a7afbe;
  --muted2:#6f7888;
  --border:#29313d;
  --ok:#56c58a;
  --ok-bg:rgba(86,197,138,.13);
  --danger:#ef7770;
  --danger-bg:rgba(239,119,112,.13);
  --tap:48px;
  --radius:16px;
  --shadow:0 18px 50px rgba(0,0,0,.22);
}
html{color-scheme:dark;scroll-behavior:smooth;}
#appShell{display:block;}
body{
  background:
    radial-gradient(circle at 8% -8%,rgba(242,138,75,.11),transparent 30rem),
    radial-gradient(circle at 100% 0%,rgba(62,113,170,.10),transparent 28rem),
    var(--bg);
  letter-spacing:-.01em;
}
button,input,select,textarea{transition:border-color .18s ease,background .18s ease,box-shadow .18s ease,transform .18s ease,opacity .18s ease;}
button:hover{transform:translateY(-1px);}
button:active{transform:translateY(0);}
.topbar{
  min-height:72px;padding:.8rem 1rem;border-bottom:1px solid rgba(255,255,255,.06);
  background:rgba(11,13,18,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.topbar-page{font-size:1.05rem;letter-spacing:-.02em;}
.topbar::after{content:'Local workspace';margin-left:auto;color:var(--muted2);font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
.icon-sq{box-shadow:0 8px 22px rgba(242,138,75,.18);}
.icon-sq:nth-child(2){background:var(--card2);border:1px solid var(--border);box-shadow:none;}
.drawer{background:rgba(15,18,25,.97);border-right:1px solid rgba(255,255,255,.06);box-shadow:20px 0 60px rgba(0,0,0,.18);}
.drawer-header{padding-top:1.35rem;}
.drawer-brand-icon{box-shadow:0 8px 24px rgba(242,138,75,.18);}
.drawer-cong{line-height:1.45;}
.drawer-section{padding-top:1.15rem;}
.drawer-item{font-size:.92rem;color:#cbd1dc;}
.drawer-item.active{box-shadow:inset 3px 0 var(--accent);}
.wrap{max-width:760px;padding-top:1.35rem;}
.eyebrow{font-size:11px;letter-spacing:.13em;color:var(--accent-strong);}
h1.page-title{font-size:clamp(2rem,7vw,2.8rem);line-height:1.03;letter-spacing:-.055em;}
.subtext{line-height:1.55;}
.banner{background:var(--banner-bg);border:1px solid rgba(242,138,75,.18);box-shadow:0 14px 34px rgba(0,0,0,.14);line-height:1.45;}
section{margin-top:2rem;}
.eyebrow-label{letter-spacing:.13em;color:#8892a2;}
.field-label{font-size:11px;letter-spacing:.08em;color:#9ca6b6;margin-top:.85rem;}
.field-input,.field-select{background:rgba(29,36,48,.86);border-color:#303a49;box-shadow:inset 0 1px 0 rgba(255,255,255,.02);}
.field-input:hover,.field-select:hover,.search-btn:hover{border-color:#465264;}
.field-input:focus,.field-select:focus{box-shadow:0 0 0 3px rgba(242,138,75,.14);}
.search-btn{background:var(--card2);border-color:#303a49;}
.qa-card,.glance-row,.item-card,.rr-card{background:linear-gradient(145deg,rgba(23,28,38,.98),rgba(19,24,33,.98));border:1px solid rgba(255,255,255,.055);box-shadow:0 10px 30px rgba(0,0,0,.12);}
.qa-card:hover,.glance-row:hover,.item-card:hover,.rr-card:hover{border-color:rgba(242,138,75,.38);box-shadow:0 16px 34px rgba(0,0,0,.2);}
.qa-card{min-height:72px;padding:1.05rem 1.15rem;}
.qa-card .qa-sub{line-height:1.4;}
.glance-row{min-height:66px;}
.glance-label{font-size:.92rem;color:#dfe3ea;}
.glance-value{font-size:1.6rem;}
.item-card{border-radius:var(--radius);}
.item-name{font-weight:650;line-height:1.35;}
.item-sub{line-height:1.45;}
.cat-item{color:#b7d3f7;border-bottom-color:rgba(255,255,255,.08);}
.cat-item:hover{color:var(--accent-strong);padding-left:.35rem;}
.btn{box-shadow:0 8px 18px rgba(0,0,0,.12);}
.btn-primary{background:linear-gradient(135deg,var(--accent-strong),var(--accent));color:#22150f;box-shadow:0 10px 24px rgba(242,138,75,.2);}
.btn-primary:hover{background:linear-gradient(135deg,#ffad78,#ef7e3c);}
.btn-ghost{background:var(--card2);}
.btn-danger{border:1px solid rgba(239,119,112,.16);}
.add-btn{background:linear-gradient(135deg,var(--accent-strong),var(--accent));color:#22150f;}
.rr-card{padding:1.15rem;}
.duty-card{background:linear-gradient(135deg,#4b291d 0%,#25191a 100%);border:1px solid rgba(242,138,75,.2);box-shadow:var(--shadow);}
.duty-name{letter-spacing:-.04em;line-height:1.12;}
.pill{letter-spacing:.06em;}
.empty{background:rgba(23,28,38,.5);border-color:#394354;line-height:1.5;}
.simple-wrap{overflow-x:auto;border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);background:rgba(17,21,29,.55);}
table.simple{min-width:560px;margin-top:0;}
table.simple th{background:rgba(255,255,255,.025);padding:.75rem .65rem;}
table.simple td{padding:.75rem .65rem;}
table.simple tr:last-child td{border-bottom:0;}
.toast{background:#f7f8fb;color:#11151b;box-shadow:0 14px 34px rgba(0,0,0,.35);}
.modal-scrim{background:rgba(4,6,10,.76);backdrop-filter:blur(6px);}
.modal{background:linear-gradient(180deg,#171c26,#11151d);border:1px solid rgba(255,255,255,.08);box-shadow:0 -18px 55px rgba(0,0,0,.38);animation:modalIn .2s ease-out;}
.modal h3{letter-spacing:-.03em;font-size:1.25rem;}
@keyframes modalIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.hero-card{position:relative;overflow:hidden;margin-top:1.25rem;padding:1.35rem;border:1px solid rgba(242,138,75,.2);border-radius:22px;background:linear-gradient(135deg,rgba(67,37,25,.96),rgba(25,24,31,.96));box-shadow:var(--shadow);}
.hero-card::after{content:'';position:absolute;width:180px;height:180px;right:-50px;top:-70px;border-radius:50%;background:rgba(242,138,75,.14);filter:blur(2px);}
.hero-kicker{position:relative;z-index:1;color:#f6c5a2;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;}
.hero-title{position:relative;z-index:1;max-width:18ch;margin:.45rem 0 0;font-size:clamp(1.6rem,6vw,2.35rem);line-height:1.05;letter-spacing:-.055em;}
.hero-note{position:relative;z-index:1;max-width:42ch;margin:.65rem 0 0;color:#e8c8b5;font-size:.88rem;line-height:1.5;}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem;margin-top:.9rem;}
.stat-card{padding:1rem;border-radius:15px;background:rgba(23,28,38,.92);border:1px solid rgba(255,255,255,.06);}
.stat-label{color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;}
.stat-value{margin-top:.35rem;color:var(--text);font-size:1.45rem;font-weight:800;letter-spacing:-.04em;}
.stat-meta{margin-top:.2rem;color:var(--muted2);font-size:.76rem;line-height:1.35;}
.section-heading{display:flex;align-items:end;justify-content:space-between;gap:1rem;margin-bottom:.7rem;}
.section-heading .eyebrow-label{margin-bottom:0;}
@media (min-width:900px){
  .drawer{transform:none;width:270px;max-width:none;}
  .drawer-close{display:none;}
  .topbar,.wrap{margin-left:270px;max-width:none;}
  .topbar{padding-left:2rem;padding-right:2rem;}
  .wrap{padding:2.4rem 3.5rem 5rem;}
  .topbar .icon-sq:first-child{display:none;}
  .topbar-page{font-size:1.15rem;}
  .hero-card{padding:1.8rem;}
  .stat-grid{grid-template-columns:repeat(4,minmax(0,1fr));}
}
@media (max-width:520px){
  .topbar::after{content:'';}
  .wrap{padding-left:1rem;padding-right:1rem;}
  .modal{max-height:90vh;}
  .rr-grid{gap:.7rem;}
  .rr-val{font-size:1.15rem;}
}

</style>
</head>
<body>

<div id="appShell">
<div class="topbar">
  <button class="icon-sq" id="drawerBtn" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <button class="icon-sq" onclick="goPage('home')" aria-label="Home">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 19V10.5a1 1 0 0 1 .38-.78l7-5.6a1 1 0 0 1 1.24 0l7 5.6a1 1 0 0 1 .38.78V19a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-4a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z" stroke="white" stroke-width="1.7" stroke-linejoin="round"/></svg>
  </button>
  <div class="topbar-page" id="topbarTitle">Home</div>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer" role="dialog" aria-label="Main menu" aria-hidden="true">
  <div class="drawer-header">
    <div class="drawer-brand-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5C10 3.5 6.5 3 4 3v15c2.5 0 6 .5 8 2 2-1.5 5.5-2 8-2V3c-2.5 0-6 .5-8 2z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 5v15" stroke="white" stroke-width="1.6"/></svg>
    </div>

function loadState(){
  let raw = null;
  try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
  if(!raw) return DEFAULT_STATE();
  try{
    const parsed = JSON.parse(raw);
    const seed = DEFAULT_STATE();
    return {
      congregation: parsed.congregation || seed.congregation,
      languages: Array.isArray(parsed.languages) ? parsed.languages : seed.languages,
      categories: Array.isArray(parsed.categories) ? parsed.categories : seed.categories,
      requests: Array.isArray(parsed.requests) ? parsed.requests : [],
      recurringRequests: Array.isArray(parsed.recurringRequests) ? parsed.recurringRequests : seed.recurringRequests,
      shipments: Array.isArray(parsed.shipments) ? parsed.shipments : [],
      inventory: Array.isArray(parsed.inventory) ? parsed.inventory : seed.inventory,
      inventoryReport: parsed.inventoryReport || seed.inventoryReport,
      rotation: (parsed.rotation && Array.isArray(parsed.rotation.publishers)) ? {...seed.rotation, ...parsed.rotation} : seed.rotation,
      monthlyMovement: Array.isArray(parsed.monthlyMovement) ? parsed.monthlyMovement : seed.monthlyMovement,
      masterPublications: Array.isArray(parsed.masterPublications) ? parsed.masterPublications : seed.masterPublications,
      otherPubs: Array.isArray(parsed.otherPubs) ? parsed.otherPubs : [],
      guidelines: Array.isArray(parsed.guidelines) && parsed.guidelines.length ? parsed.guidelines : seed.guidelines,
    };
  }catch(e){ return DEFAULT_STATE(); }
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
function uid(){ return 'id_' + Date.now() + '_' + Math.floor(Math.random()*10000); }
function esc(str){ return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ============================================================
   LITERATURE DISPLAY ROTATION
   Rotation data (publisher order, meeting time, coordinator &
   overseer names) is stored locally on this device in
   state.rotation (localStorage), same as the rest of the app's data.
============================================================= */
function isoWeek(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}
function currentRotationIndex(){
  const r = state.rotation;
  if(!r.publishers.length) return -1;
  return isoWeek(new Date()) % r.publishers.length;
}
function canManageRotation(){ return true; }
function canShareRotation(){ return true; }
function renderRotationLive(){ /* rotation lives in local state; nothing to fetch */ }
function myDutyBlock(){
  if(!currentUser || currentUser.role !== 'publisher') return '';
  const r = state.rotation;
  const idx = currentRotationIndex();
  const myIdx = r.publishers.findIndex(p => p.trim().toLowerCase() === currentUser.full_name.trim().toLowerCase());
  const isMe = myIdx >= 0 && myIdx === idx;
  let nextText = '\u2014';
  if(myIdx >= 0 && r.publishers.length){
    let stepsAhead = (myIdx - idx + r.publishers.length) % r.publishers.length;
    if(stepsAhead === 0) stepsAhead = r.publishers.length;
    const weeksOut = stepsAhead;
    nextText = weeksOut === r.publishers.length && isMe ? 'This week' : `In ${weeksOut} week${weeksOut===1?'':'s'}`;
  }
  return `
    <div class="duty-card">
      <div class="duty-eyebrow">My Literature Display Duty</div>
      <div class="duty-name">${isMe ? "You're on duty this week" : 'You are not assigned this week'}</div>
      ${!isMe ? `<div class="subtext" style="color:#E7B98A;margin-top:.3rem;">Next time you are scheduled: ${myIdx>=0 ? esc(nextText) : 'not currently on the rotation list'}.</div>` : ''}
      <div class="duty-grid">
        <div><div class="duty-label">Meeting Time</div><div class="duty-val">${esc(r.meetingTime || '\u2014')}</div></div>
        <div><div class="duty-label">Next Assignment</div><div class="duty-val">${esc(nextText)}</div></div>
      </div>
    </div>`;
}
function pageRotation(){
  const r = state.rotation;
  const idx = currentRotationIndex();
  const onDuty = idx >= 0 ? r.publishers[idx] : null;
  const nextIdx = idx >= 0 ? (idx + 1) % r.publishers.length : -1;
  const nextUp = nextIdx >= 0 ? r.publishers[nextIdx] : null;

  return `
    <div class="eyebrow">Literature Display</div>
    <h1 class="page-title">Weekly Rotation</h1>

    <section style="margin-top:1rem;">
      <div class="duty-card">

        </div>
      </div>

    ${myDutyBlock()}

    <section>
      <div class="eyebrow-label">Full Rotation</div>
      <div class="item-list">
        ${r.publishers.map((p,i) => `
          <div class="item-card" style="${i===idx ? 'border:1px solid var(--accent);' : ''}">
            <div class="item-name">${i+1}. ${esc(p)}</div>
            ${i===idx ? `<span class="pill pill-ok">This week</span>` : ''}
          </div>
        `).join('')}
        ${!r.publishers.length ? `<div class="empty">No publishers on the rotation yet.</div>` : ''}
      </div>
    </section>

    <section>
      <div class="eyebrow-label">Coordinator &amp; Overseer</div>
      <div class="item-list">
        <div class="item-card"><div><div class="item-name">${esc(r.coordinator || '\u2014')}</div><div class="item-sub">Coordinator</div></div></div>
        <div class="item-card"><div><div class="item-name">${esc(r.overseer || '\u2014')}</div><div class="item-sub">Overseer</div></div></div>
      </div>
    </section>

    ${canManageRotation() ? `
    <section>
      <div class="eyebrow-label">Manage Rotation</div>
      <div class="subtext" style="margin-top:0;">Edit the publisher order and meeting time. Changes save to the shared roster for everyone.</div>
      <button class="btn btn-primary btn-block" style="margin-top:.8rem;" onclick="openEditRotationModal()">Edit Rotation</button>
    </section>` : ''}

    <section>
      <div class="eyebrow-label">Share</div>
      <div class="subtext" style="margin-top:0;">${canShareRotation() ? 'You are authorized to share this schedule outside the app.' : 'Viewing only — sharing is limited to the Overseer, Coordinator, and anyone they authorize.'}</div>
      ${canShareRotation() ? `<button class="btn btn-primary btn-block" style="margin-top:.8rem;" onclick="attemptShareRotation()">Share Schedule</button>` : ''}
    </section>
  `;
}
function rotationShareText(){
  const r = state.rotation;
  const idx = currentRotationIndex();
  const lines = [
    `Literature Display Rotation — ${state.congregation.name}`,
    `Publishers rotate weekly to display literature before meetings start at ${r.meetingTime}.`,
    ``,
    `This week on duty: ${idx>=0 ? r.publishers[idx] : '—'}`,
    ``,
    `Rotation order:`,
    ...r.publishers.map((p,i)=> `${i+1}. ${p}${i===idx ? '  <- this week' : ''}`),
    ``,
    `Coordinator: ${r.coordinator}`,
    `Overseer: ${r.overseer}`,
  ];
  return lines.join('\n');
}
async function attemptShareRotation(){
  if(!canShareRotation()){ toast('You are not authorized to share this schedule.'); return; }
  const text = rotationShareText();
  try{
    if(navigator.share){
      await navigator.share({ title:'Literature Display Rotation', text });
      toast('Schedule shared.');
      return;
    }
  }catch(e){ /* user cancelled share sheet — fall through to copy */ }
  try{
    await navigator.clipboard.writeText(text);
    toast('Schedule copied to clipboard.');
  }catch(e){
    toast('Could not share automatically — schedule is ready to copy manually.');
  }
}

  closeModal();
  render();
  toast('Rotation updated.');
}

/* ============================================================
   ROUTER
============================================================= */
const PAGE_TITLES = {
  home:'Home', overview:'Overview', litcoord:'Literature Coordination',
  pubManagement:'Publications', guidelines:'Guidelines',
  requestPublication:'Request', recurringRequests:'Recurring',
  otherPubs:'Other Publications', rotation:'Display Rotation',
  historyRequests:'Requests', historyShipments:'Shipments',
  inventoryReports:'Inventory', monthlyMovement:'Movement'
};
function goPage(p){
  if(!pageAllowedForRole(p)){ toast('Not available for your role.'); p = 'home'; }
  currentPage = p; currentCategoryFilter = null; recurringHint = null;
  drawer.querySelectorAll('.drawer-item[data-page]').forEach(b=>b.classList.toggle('active', b.dataset.page===p && !b.dataset.cat && !b.dataset.hint));
  render();
}
function render(){
  if(!currentUser) return;
  if(!pageAllowedForRole(currentPage)) currentPage = 'home';
  document.getElementById('topbarTitle').textContent = PAGE_TITLES[currentPage] || 'Home';
  const app = document.getElementById('app');
  switch(currentPage){
    case 'home': app.innerHTML = pageHome(); break;
    case 'overview': app.innerHTML = pageOverview(); break;
    case 'litcoord': app.innerHTML = pageLitCoord(); break;
    case 'pubManagement': app.innerHTML = pagePubManagement(); renderMasterCatalog(); break;
    case 'guidelines': app.innerHTML = pageGuidelines(); break;
    case 'rotation': app.innerHTML = pageRotation(); renderRotationLive(); break;
    case 'requestPublication': app.innerHTML = pageRequestPublication(); renderPubList(); break;
    case 'recurringRequests': app.innerHTML = pageRecurringRequests(); break;
    case 'otherPubs': app.innerHTML = pageOtherPubs(); break;
    case 'historyRequests': app.innerHTML = pageHistoryRequests(); break;
    case 'historyShipments': app.innerHTML = pageHistoryShipments(); break;
    case 'inventoryReports': app.innerHTML = pageInventoryReports(); break;
    case 'monthlyMovement': app.innerHTML = pageMonthlyMovement(); break;
    default: app.innerHTML = pageHome();
  }
}
document.addEventListener('keydown', (event)=>{
  if(event.key === 'Escape'){
    if(document.getElementById('modalHost').innerHTML) closeModal();
    else closeDrawer();
  }
});
document.querySelector('.drawer-item[data-page="home"]').classList.add('active');
render();
</script>
